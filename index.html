<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFF Partner Hub BD - Official</title>
    <style>
        /* পুরো পেজের ব্যাকগ্রাউন্ড হিসেবে ছবিটি সেট করা */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d2137 url('banner.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        /* কন্টেন্ট বক্সের স্টাইল */
        .glass-box {
            background: rgba(13, 33, 55, 0.85); /* নীলচে স্বচ্ছ ভাব */
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        h1 { font-size: 2.5rem; color: #ffcc00; margin-bottom: 10px; }
        p { font-size: 1.1rem; line-height: 1.6; margin-bottom: 30px; }

        /* টেলিগ্রাম বাটনের স্টাইল */
        .btn-telegram {
            display: inline-block;
            background: #0088cc;
            color: white;
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
        }

        .btn-telegram:hover {
            background: #00aaff;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="glass-box">
        <h1>AFF Partner Hub BD</h1>
        <p>বাংলাদেশের সবথেকে বিশ্বস্ত স্পোর্টস নেটওয়ার্ক পার্টনার প্রোগ্রামে আপনাকে স্বাগতম। সাব-এজেন্ট ক্যারিয়ার এবং স্পেশাল অফার পেতে আমাদের অফিসিয়াল কমিউনিটিতে যোগ দিন।</p>
        
        <a href=https://t.me/subagent011 class="btn-telegram">Join Our Telegram</a>
    </div>

</body>
</html>
